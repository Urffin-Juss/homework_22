{% extends "catalog/base.html" %}
{% block content %}
<h1>{{ post.title }}</h1>

{% if post.preview %}
  <img src="{{ post.preview.url }}" style="max-width:400px;">
{% endif %}

<p>{{ post.content|linebreaks }}</p>
<p><b>Просмотров:</b> {{ post.views_count }}</p>

<a href="{% url 'blog:post_update' post.pk %}">Редактировать</a>
<a href="{% url 'blog:post_delete' post.pk %}">Удалить</a>
<a href="{% url 'blog:post_list' %}">Назад</a>
{% endblock %}
