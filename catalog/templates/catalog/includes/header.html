<!-- catalog/templates/catalog/includes/header.html -->
<header>
    <div class="header-content">
        <h1><a href="/catalog/static" style="color: white; text-decoration: none;">Интернет-магазин</a></h1>
        <nav>
            <a href="/catalog/static" class="btn">Главная</a>
            <a href="/admin/" class="btn">Админка</a>
            {% if user.is_authenticated %}
                <a href="/admin/logout/" class="btn">Выйти</a>
            {% else %}
                <a href="/admin/login/" class="btn">Войти</a>
            {% endif %}
        </nav>
    </div>
</header>

<style>
    header {
        background-color: #2c3e50;
        color: white;
        padding: 20px 0;
        margin-bottom: 30px;
    }

    .header-content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    nav {
        display: flex;
        gap: 10px;
    }

    h1 {
        font-size: 2rem;
        margin: 0;
    }
</style>
